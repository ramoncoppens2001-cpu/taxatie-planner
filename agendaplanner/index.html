    const a = ps[0], z = ps[ps.length-1];
    let s = fmtDag.format(a.start) + ", " + tijdTekst(a.start) + "–" + tijdTekst(a.eind);
    if(ps.length > 1) s += " + " + (ps.length-1) + (ps.length > 2 ? " delen" : " deel") + " tot " + (datumIso(z.start) !== datumIso(a.start) ? fmtDag.format(z.start) + " " : "") + tijdTekst(z.eind);
    if(a.botst) s += ", botst met een ander vast moment";
    span.textContent = s; span.classList.toggle("botst", a.botst);
  });

  const w = $("#dWanneer");
  if(delen.length){
    const a = eersteVan(delen), z = laatsteVan(delen);
    w.innerHTML = datumIso(a) === datumIso(z)
      ? `${esc(groot(fmtLang.format(a)))}<br>van ${tijdTekst(a)} tot ${tijdTekst(z)}`
      : `Van ${tijdTekst(a)} ${esc(fmtLang.format(a))}<br>tot ${tijdTekst(z)} ${esc(fmtLang.format(z))}`;
    w.classList.remove("leeg");
  } else { w.textContent = "Nog niets ingepland"; w.classList.add("leeg"); }

  const st = deadlineStatus(delen);
  let labels = st.soort === "mis" ? `<span class="label mis">${deadlineLabel(st)}</span>` : st.soort === "ok" ? `<span class="label ja">${deadlineLabel(st)}</span>` : "";
  if(dos.inAgenda) labels += dos.gewijzigd > dos.inAgenda ? `<span class="label wijz">Gewijzigd na downloaden</span>` : `<span class="label ja">Gedownload</span>`;
  $("#dLabels").innerHTML = labels;

  const D = deadlineMoment(), noot = $("#deadlineNoot");
  if(D){
    noot.innerHTML = (st.soort === "mis" ? `Je bent pas klaar op ${esc(fmtDag.format(laatsteVan(delen)))}. ` : `Klaar uiterlijk ${esc(fmtDagMaand.format(D))} om ${tijdTekst(D)}. `)
      + `<button type="button" class="tekstknop" id="kTerug" style="font-size:12px">${st.soort === "mis" ? "Plan terug vanaf de deadline" : "Zo laat mogelijk beginnen"}</button>`;
    noot.classList.toggle("fout", st.soort === "mis");
    $("#kTerug").onclick = doeTerugplannen;
  } else { noot.textContent = "Met een deadline zie je hoeveel speling je hebt."; noot.classList.remove("fout"); }

  $("#zijTotaal").innerHTML = `<span><b class="num">${delen.length}</b> afspraken</span><span><b>${duurTekst(totaalMinuten())}</b> werk</span>`;
  $("#kAgenda").innerHTML = `${ico("kalplus")}${dos.inAgenda && dos.gewijzigd > dos.inAgenda ? "Opnieuw in agenda zetten" : "Zet in agenda"}`;

  if(volg){
    const start = delen.length ? eersteVan(delen) : opDag(dos.startDatum, 0);
    weekStart = maandagVan(start); dagInBeeld = dagStart(start);
  }
  if(!weekStart) weekStart = maandagVan(new Date());
  if(!dagInBeeld) dagInBeeld = dagStart(opDag(dos.startDatum, 0));
  renderKalender(delen);
  if(pop) renderPop(false);
}

/* ---------------- de agenda: dag, werkweek of week ---------------- */
function zichtbareDagen(){
  if(weergave === "dag") return [dagStart(dagInBeeld)];
  const r = [];
  for(let i=0; i<(weergave === "7" ? 7 : 5); i++) r.push(plusDagen(weekStart, i));
  return r;
}
/* Indeling van een dag. Lange afspraken krijgen de volle breedte. Korte
   afspraken (zoals 5 minuten) krijgen een minimale hoogte, zodat je ze kunt
   lezen; vallen ze over een lange afspraak, dan komen ze er rechts naast te
   staan in plaats van eroverheen. Korte taken die elkaar raken staan naast
   elkaar, zoals in Agenda. */
function kolommen(lijst){
  lijst.sort((a,b) => a.top - b.top || b.h - a.h);
  const groepen = []; let groep = null, eind = -1;
  lijst.forEach(it => {
    if(!groep || it.top >= eind){ groep = {items:[], kol:[]}; groepen.push(groep); eind = -1; }
    let k = groep.kol.findIndex(bodem => bodem <= it.top + .5);
    if(k === -1){ k = groep.kol.length; groep.kol.push(0); }
    groep.kol[k] = it.top + it.h + 1; it.kol = k; groep.items.push(it);
    eind = Math.max(eind, it.top + it.h + 1);
  });
  groepen.forEach(g => g.items.forEach(it => it.n = g.kol.length));
  return groepen;
}
const BAAN = .44;   // deel van de breedte dat links vrij blijft voor de lange afspraak
function legUit(items){
  const lang = items.filter(it => it.echt >= MINH), kort = items.filter(it => it.echt < MINH).sort((a,b) => a.top - b.top);
  kolommen(lang);
  // Korte taken die op elkaar volgen, komen onder elkaar te staan, elk met de eigen begintijd erbij.
  const groepen = []; let groep = null, bodem = -1;
  kort.forEach(it => {
    if(!groep || it.top > bodem + .5){ groep = []; groepen.push(groep); }
    else it.top = bodem + 1;
    it.kol = 0; it.n = 1; groep.push(it); bodem = it.top + it.h;
  });
  groepen.forEach(g => {
    const van = g[0].top, tot = g[g.length-1].top + g[g.length-1].h;
    const onder = lang.filter(l => l.top < tot && l.top + l.h > van);
    g.forEach(it => it.baan = onder.length ? BAAN : 0);
    onder.forEach(l => l.metBaan = true);
  });
  lang.forEach(it => it.baan = 0);
  return items;
}
function evHtml(it, dagMode){
  const p = it.p, nd = naamDelen(p), kort = it.h < 34, ruim = dagMode && it.h >= 58;
  const tijd = tijdTekst(p.start) + "–" + tijdTekst(p.eind), min = minutenVan(p);
  const vrij = 1 - it.baan;
  const links = `calc(3px + (100% - 7px) * ${it.baan + vrij * it.kol / it.n})`;
  const breed = `calc((100% - 7px) * ${vrij / it.n} - ${it.n > 1 || it.baan ? 2 : 0}px)`;
  return `<div class="ev${kort ? " kort" : ""}${it.echt < MINH ? " klein" : ""}${it.metBaan ? " met-baan" : ""}${p.botst ? " botst" : ""}${gekozen === p.taak.id ? " aan" : ""}" tabindex="0" role="button"
    data-taak="${esc(p.taak.id)}" data-deel="${p.deel}" data-min="${min}" style="top:${it.top + 1}px;height:${it.h}px;left:${links};width:${breed}"
    title="${esc(titel(p))}, ${tijd} (${duurTekst(min)})">
    <b>${nd.nr ? `<em>${esc(nd.nr)}</em>` : ""}${esc(nd.taak)}</b>
    ${kort ? `<i class="tk">${dagMode ? tijdTekst(p.start) + ", " + duurKort(min) : tijdTekst(p.start)}</i>`
           : `<i><svg viewBox="0 0 24 24">${P.klok}</svg><span data-t>${tijd}</span>${dagMode ? `<span class="duurlbl">${duurKort(min)}</span>` : ""}</i>`}
    ${ruim ? `<small>${esc(p.taak.groep)}${dos.adres.trim() ? ", " + esc(dos.adres.trim()) : ""}</small>` : ""}
    ${p.vast && !kort ? `<svg class="speld" viewBox="0 0 24 24">${P.pin}</svg>` : ""}
    ${p.delen === 1 ? `<span class="rs" data-rs title="Sleep om de duur te veranderen"></span>` : ""}
  </div>`;
}
function renderKalender(delen){
  const dagMode = weergave === "dag";
  UUR = dagMode ? uurHoogte.dag : uurHoogte.week;
  const dagen = zichtbareDagen(), n = dagen.length, eerste = dagen[0], laatste = dagen[n-1], naLaatste = plusDagen(laatste, 1);
  const kolommen = dagMode ? "56px minmax(0,1fr)" : `56px repeat(${n}, minmax(${n === 7 ? 104 : 132}px, 1fr))`;
  if(dagMode){
    $("#kalTitel").textContent = fmtDagKort.format(eerste) + " " + eerste.getFullYear();
    $("#kalSub").textContent = groot(fmtWdLang.format(eerste)) + ", week " + weeknummer(eerste);
  } else {
    const m1 = fmtMaandNaam.format(eerste), m2 = fmtMaandNaam.format(laatste);
    $("#kalTitel").textContent = m1 === m2 ? groot(fmtMaand.format(eerste)) : groot(m1) + " – " + m2 + " " + laatste.getFullYear();
    $("#kalSub").textContent = "Week " + weeknummer(eerste);
  }
  zetBadge($("#kVorige"), delen.filter(p => p.start < eerste).length);
  zetBadge($("#kVolgende"), delen.filter(p => p.start >= naLaatste).length);

  const D = deadlineMoment(), nu = new Date(), vandaagIso = datumIso(nu);
  const b = hm(I.begin), e = hm(I.eind), pv = hm(I.pauzeVan), pt = hm(I.pauzeTot);
  const y = m => m / 60 * UUR;

  let kop = `<div class="wk-hoek"></div>`;
  dagen.forEach(d => {
    const iso = datumIso(d), som = delen.filter(p => datumIso(p.start) === iso).reduce((s,p) => s + minutenVan(p), 0);
    kop += `<div class="wk-dk${vrijReden(d) || !isWerkdag(d) ? " vrij" : ""}"><span class="wd">${esc(wdKort(d))}</span><span class="dn${iso === vandaagIso ? " vandaag" : ""}">${d.getDate()}</span><span class="som">${som ? duurKort(som) : ""}</span></div>`;
  });
  kop += `<div class="wk-ad-goot">hele dag</div>`;
  dagen.forEach(d => {
    const iso = datumIso(d), reden = vrijReden(d);
    let chips = "";
    if(D && datumIso(D) === iso) chips += `<div class="adchip deadline" title="Deadline">${ico("vlag")}Deadline ${tijdTekst(D)}</div>`;
    if(reden) chips += `<div class="adchip vrij">${esc(reden)}</div>`;
    kop += `<div class="wk-ad">${chips}</div>`;
  });

  let goot = "";
  for(let h=1; h<24; h++) goot += `<span style="top:${h*UUR}px">${tc(h)}:00</span>`;
  if(dagen.some(d => datumIso(d) === vandaagIso)) goot += `<span class="nu" style="top:${y(minVan(nu))}px">${tijdTekst(nu)}</span>`;

  const kols = dagen.map(d => {
    const iso = datumIso(d), werk = blokken(d).length > 0;
    let a = "";
    if(werk){
      a += `<div class="buiten" style="top:0;height:${y(b)}px"></div><div class="buiten" style="top:${y(e)}px;height:${y(1440-e)}px"></div>`;
      if(pauzeGeldig()) a += `<div class="pauzevlak" style="top:${y(pv)}px;height:${y(pt-pv)}px" title="Pauze"></div>`;
    }
    if(D && datumIso(D) === iso) a += `<div class="dllijn" style="top:${y(minVan(D))}px"></div>`;
    if(iso === vandaagIso) a += `<div class="nulijn" style="top:${y(minVan(nu))}px"></div>`;
    const items = delen.filter(p => datumIso(p.start) === iso).map(p => {
      const s = minVan(p.start), en = datumIso(p.eind) === iso ? minVan(p.eind) : 1440, echt = y(en - s) - 2;
      return {p, top:y(s), echt, h:Math.max(MINH, echt)};
    });
    a += legUit(items).map(it => evHtml(it, dagMode)).join("");
    return `<div class="wk-dag${werk ? "" : " vrij"}" data-iso="${iso}">${a}</div>`;
  }).join("");

  const inBeeld = delen.some(p => p.start >= eerste && p.start < naLaatste);
  const leeg = !inBeeld && !dagMode ? `<div class="leegweek">${delen.length ? "Geen afspraken in deze week." : "Vink een taak aan om hem in te plannen."}${delen.length ? `<br><button type="button" class="pil blauw" data-naarplan>Naar de planning</button>` : ""}</div>` : "";

  grid.classList.toggle("dagmodus", dagMode);
  const scroll = grid.scrollTop, scrollX = grid.scrollLeft;
  grid.innerHTML = `<div class="wk-kop" style="grid-template-columns:${kolommen}">${kop}</div>
    <div class="wk-lijf" style="grid-template-columns:${kolommen};height:${24*UUR}px;--uur:${UUR}px"><div class="wk-goot">${goot}</div>${kols}${leeg}</div>`;
  const sleutel = weergave + "-" + datumIso(eerste) + "-" + UUR;
  if(sleutel !== laatsteWeekSleutel){
    const nieuweWeek = !laatsteWeekSleutel.startsWith(weergave + "-" + datumIso(eerste));
    if(nieuweWeek){
      const eersteAfspraak = delen.filter(p => p.start >= eerste && p.start < naLaatste).reduce((m,p) => Math.min(m, minVan(p.start)), b);
      grid.scrollTop = Math.max(0, y(Math.min(b, eersteAfspraak)) - UUR * .75);
      const eersteKol = $$(".wk-dag", grid).find(k => k.querySelector(".ev"));   // op een smal scherm meteen naar de eerste dag met afspraken
      grid.scrollLeft = eersteKol ? Math.max(0, eersteKol.offsetLeft - 56) : 0;
    }
    laatsteWeekSleutel = sleutel;
  } else { grid.scrollTop = scroll; grid.scrollLeft = scrollX; }
  renderDagStrip(delen);
  renderDagLijst(delen);
}

/* Bovenaan de dagweergave: de week als rij dagen, zoals op de iPad */
function renderDagStrip(delen){
  const el = $("#dagStrip");
  if(weergave !== "dag"){ el.hidden = true; return; }
  el.hidden = false;
  const ma = maandagVan(dagInBeeld), vandaag = datumIso(new Date()), sel = datumIso(dagInBeeld);
  el.innerHTML = [0,1,2,3,4,5,6].map(i => {
    const d = plusDagen(ma, i), iso = datumIso(d), heeft = delen.some(p => datumIso(p.start) === iso);
    return `<button type="button" class="ds-dag${iso === sel ? " aan" : ""}${iso === vandaag ? " vandaag" : ""}${heeft ? " heeft" : ""}${!isWerkdag(d) || vrijReden(d) ? " vrij" : ""}"
      data-dag="${iso}" aria-pressed="${iso === sel}" aria-label="${esc(groot(fmtDagMaand.format(d)))}${heeft ? ", met afspraken" : ""}">
      <span class="wd">${esc(wdKort(d))}</span><span class="dn">${d.getDate()}</span><span class="stip"></span></button>`;
  }).join("");
}
/* Naast de tijdlijn: alle afspraken van de dag onder elkaar, ook die van 5 minuten */
function renderDagLijst(delen){
  const el = $("#dagLijst");

  el.hidden = false;
  const d = dagStart(dagInBeeld), iso = datumIso(d), D = deadlineMoment(), reden = vrijReden(d);
  const ps = delen.filter(p => datumIso(p.start) === iso).sort((a,b) => a.start - b.start);

  el.innerHTML = `<div class="dl-kop"><h3>${esc(groot(fmtDagMaand.format(d)))}</h3>
      <span>${ps.length ? `${ps.length} ${ps.length === 1 ? "afspraak" : "afspraken"}, ${duurTekst(som)}` : "Geen afspraken"}</span></div>
    ${reden ? `<div class="dl-melding">${ico("zon2")}${esc(reden)}, er wordt niets ingepland</div>` : ""}
    ${D && datumIso(D) === iso ? `<div class="dl-melding rood">${ico("vlag")}Deadline om ${tijdTekst(D)}</div>` : ""}
    ${ps.length ? `<div class="dl-groep">${ps.map(p => `<button type="button" class="dl-rij${gekozen === p.taak.id ? " aan" : ""}" data-taak="${esc(p.taak.id)}" data-deel="${p.deel}">
        <span class="dl-tijd"><b>${tijdTekst(p.start)}</b><span>${tijdTekst(p.eind)}</span></span><span class="dl-balk"></span>
        <span class="dl-naam"><b>${esc(naamDelen(p).taak)}</b><small>${esc(p.taak.groep)}${p.vast ? ", vast moment" : ""}${p.botst ? ", botst met een ander vast moment" : ""}</small></span>
        <span class="dl-duur">${duurKort(minutenVan(p))}</span></button>`).join("")}</div>`
      : `<div class="dl-leeg">${delen.length ? "Op deze dag staat niets van dit dossier." : "Vink een taak aan om hem in te plannen."}${delen.length ? `<br><button type="button" class="pil blauw" data-naarplan style="margin-top:12px">Naar de planning</button>` : ""}</div>`}`;
}
$("#dagStrip").onclick = e => { const b = e.target.closest("[data-dag]"); if(!b) return; dagInBeeld = opDag(b.dataset.dag, 0); volg = false; ververs(); };
$("#dagLijst").onclick = e => {

  const r = e.target.closest(".dl-rij"); if(r) openPop(r.dataset.taak, Number(r.dataset.deel) || 1, r);
};

/* Inzoomen: Ctrl of Cmd met scrollen, of de knoppen in het menu */
function zoom(factor, ankerY){
  const sleutel = weergave === "dag" ? "dag" : "week", oud = uurHoogte[sleutel];
  const nieuw = Math.max(36, Math.min(200, Math.round(oud * factor)));
  if(nieuw === oud) return;
  const kop = grid.querySelector(".wk-kop"), kh = kop ? kop.offsetHeight : 0;
  const ay = ankerY == null ? grid.clientHeight / 2 : ankerY;
  const minuut = (grid.scrollTop + ay - kh) / oud * 60;
  uurHoogte[sleutel] = nieuw;
  renderKalender(plan(dos));
  grid.scrollTop = Math.max(0, minuut / 60 * nieuw - ay + kh);
  if(pop) renderPop(false);
}
grid.addEventListener("wheel", e => {
  if(!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientY - grid.getBoundingClientRect().top);
}, {passive:false});
function zetBadge(knop, n){
  let b = knop.querySelector(".badge");
  if(!n){ if(b) b.remove(); return; }
  if(!b){ b = document.createElement("span"); b.className = "badge"; knop.appendChild(b); }
  b.textContent = n;
  knop.setAttribute("aria-label", (knop.id === "kVorige" ? "Vorige, nog " : "Volgende, nog ") + n + " afspraken");
}

/* Slepen met de muis: verplaatsen zet de taak vast, de onderrand trekt hem langer of korter */
grid.addEventListener("pointerdown", ev => {
  const el = ev.target.closest(".ev"); if(!el || ev.pointerType === "touch" || ev.button !== 0) return;
  const t = dos.taken.find(x => x.id === el.dataset.taak); if(!t) return;
  const modus = ev.target.closest("[data-rs]") ? "rek" : "schuif";
  const r0 = el.getBoundingClientRect(), startX = ev.clientX, startY = ev.clientY;
  const grijp = (ev.clientY - r0.top) / UUR * 60, duur = Number(el.dataset.min) || t.minuten, snap = weergave === "dag" ? 5 : 15;
  let actief = false, doelIso = null, doelMin = null, nieuweDuur = null;
  const tl = el.querySelector("[data-t]");
  const beweeg = e2 => {
    if(!actief && Math.hypot(e2.clientX - startX, e2.clientY - startY) < 5) return;
    if(!actief){ actief = true; el.classList.add("sleept"); document.body.style.userSelect = "none"; }
    e2.preventDefault();
    if(modus === "schuif"){
      const kol = $$(".wk-dag", grid).find(k => { const r = k.getBoundingClientRect(); return e2.clientX >= r.left && e2.clientX < r.right; }) || el.parentElement;
      if(kol !== el.parentElement) kol.appendChild(el);
      const rk = kol.getBoundingClientRect();
      let m = (e2.clientY - rk.top) / UUR * 60 - grijp;
      m = Math.max(0, Math.min(1440 - duur, Math.round(m / snap) * snap));
      el.style.top = (m / 60 * UUR + 1) + "px";
      doelIso = kol.dataset.iso; doelMin = m;
      if(tl) tl.textContent = minTekst(m) + "–" + minTekst(m + duur);
    } else {
      const rk = el.getBoundingClientRect();
      let d = Math.max(snap, Math.round(((e2.clientY - rk.top) / UUR * 60) / snap) * snap);
      el.style.height = Math.max(MINH, d / 60 * UUR - 2) + "px"; nieuweDuur = d;
      if(tl){ const s = tl.textContent.split("–")[0]; tl.textContent = s + "–" + minTekst(hm(s) + d); }
    }
  };
  const los = () => {
    window.removeEventListener("pointermove", beweeg); window.removeEventListener("pointerup", los); window.removeEventListener("pointercancel", los);
    document.body.style.userSelect = "";
    if(!actief) return;
    grid._net = Date.now(); el.classList.remove("sleept");
    if(modus === "schuif" && doelMin != null){
      t.vast = lokaalIso(opDag(doelIso, doelMin)); t.nieuweDag = false; geraakt(); volg = false; ververs({taken:true});
      meld(taakNaam(t) + " staat vast op " + fmtDag.format(opDag(doelIso, doelMin)) + " om " + minTekst(doelMin) + ".");
    } else if(modus === "rek" && nieuweDuur){
      t.minuten = nieuweDuur; geraakt(); volg = false; ververs({taken:true});
      meld(taakNaam(t) + " duurt nu " + duurTekst(nieuweDuur) + ".");
    } else ververs();
  };
  window.addEventListener("pointermove", beweeg); window.addEventListener("pointerup", los); window.addEventListener("pointercancel", los);
});
grid.addEventListener("click", ev => {
  if(ev.target.closest("[data-naarplan]")){ volg = true; ververs(); return; }
  const el = ev.target.closest(".ev"); if(!el) return;
  if(grid._net && Date.now() - grid._net < 300) return;
  openPop(el.dataset.taak, Number(el.dataset.deel) || 1, el);
});
grid.addEventListener("keydown", ev => {
  const el = ev.target.closest(".ev");
  if(el && (ev.key === "Enter" || ev.key === " ")){ ev.preventDefault(); openPop(el.dataset.taak, Number(el.dataset.deel) || 1, el); }
});

/* ---------------- popover met details ---------------- */
function openPop(taakId, deel, anker){
  gekozen = taakId;
  pop = {taakId, deel, anker: anker ? anker.getBoundingClientRect() : null};
  markeer(); renderPop(true);
}
function markeer(){
  $$(".ev").forEach(x => x.classList.toggle("aan", x.dataset.taak === gekozen));
  $$("#takenLijst .trij").forEach(r => r.classList.toggle("uitgelicht", r.dataset.id === gekozen));
  $$("#dagLijst .dl-rij").forEach(r => r.classList.toggle("aan", r.dataset.taak === gekozen));
}
function renderPop(eersteKeer){
  const t = dos.taken.find(x => x.id === pop.taakId); if(!t){ sluitDetail(); return; }
  const delen = plan(dos).filter(p => p.taak.id === t.id);
  const p = delen.find(x => x.deel === pop.deel) || delen[0];
  const houder = $("#popHouder"), oud = houder.querySelector(".pop"), scroll = oud ? oud.scrollTop : 0;
  houder.innerHTML = `<div class="pop" role="dialog" aria-labelledby="detailTitel">
    <div class="popkop"><button type="button" class="rond" data-sluit aria-label="Sluiten">${ico("kruis")}</button></div>
    ${detailHtml(t, p)}
    <div class="popvoet"><button type="button" id="sUit">Niet inplannen</button></div>
  </div>`;
  const el = houder.querySelector(".pop");
  const anker = (p && $(`.ev[data-taak="${CSS.escape(t.id)}"][data-deel="${p.deel}"]`)) || $(`.trij[data-id="${CSS.escape(t.id)}"]`);
  const r = anker && anker.getClientRects().length ? anker.getBoundingClientRect() : pop.anker;
  plaats(el, r);
  if(!eersteKeer) el.style.animation = "none";
  el.scrollTop = scroll;
  bindDetail(el, t, p);
  el.querySelector("[data-sluit]").onclick = sluitDetail;
  if(eersteKeer) el.querySelector("[data-sluit]").focus({preventScroll:true});
}
function plaats(el, r){
  if(window.innerWidth <= 900) return;
  const w = el.offsetWidth, h = el.offsetHeight, m = 14;
  let x;
  if(!r) x = (innerWidth - w) / 2;
  else if(r.right + m + w < innerWidth - 10) x = r.right + m;
  else if(r.left - m - w > 10) x = r.left - m - w;
  else x = Math.max(10, innerWidth - w - 10);
  let yy = r ? r.top + r.height / 2 - 140 : 80;
  yy = Math.max(14, Math.min(yy, innerHeight - h - 14));
  el.style.left = x + "px"; el.style.top = yy + "px";
}
function sluitDetail(){ pop = null; $("#popHouder").innerHTML = ""; gekozen = null; markeer(); }
window.addEventListener("resize", () => { if(pop) renderPop(false); });

/* ---------------- menu ---------------- */
function openMenu(){
  menuOpen = true; $("#kMeer").setAttribute("aria-expanded","true");
  const D = deadlineMoment();
  $("#menuHouder").innerHTML = `<div class="menu" role="menu">
    <button type="button" role="menuitem" data-m="naar"><span>Naar de planning</span>${ico("kalender")}</button>
    <button type="button" role="menuitem" data-m="ics"><span>Alles downloaden (.ics)</span>${ico("download")}</button>
    <button type="button" role="menuitem" data-m="kopie"><span>Planning kopiëren</span>${ico("kopie")}</button>
    <button type="button" role="menuitem" data-m="print"><span>Afdrukken</span>${ico("print")}</button>
    <button type="button" role="menuitem" data-m="terug" class="scheid" ${D ? "" : "disabled"}><span>Zo laat mogelijk beginnen${D ? "" : "<small>Vul eerst een deadline in</small>"}</span>${ico("terug")}</button>
    <button type="button" role="menuitem" data-m="vast"><span>Alle vaste momenten loslaten</span>${ico("pin")}</button>
    <div class="zoomrij"><span>Uren in de agenda</span><button type="button" data-z="-" aria-label="Uren kleiner">${ico("min")}</button><button type="button" data-z="+" aria-label="Uren groter">${ico("plus")}</button></div>
  </div>`;
  $("#menuHouder .menu").onclick = e => {
    const z = e.target.closest("[data-z]"); if(z){ zoom(z.dataset.z === "+" ? 1.2 : 1 / 1.2); return; }
    const b = e.target.closest("[data-m]"); if(!b || b.disabled) return;
    sluitMenu();
    ({naar:() => { volg = true; ververs(); }, ics:zetInAgenda, kopie:kopieerPlanning, print:afdrukken, terug:doeTerugplannen, vast:losAlleVasteMomenten})[b.dataset.m]();
  };
  $("#menuHouder .menu button").focus();
}
function sluitMenu(){ menuOpen = false; $("#menuHouder").innerHTML = ""; $("#kMeer").setAttribute("aria-expanded","false"); }

/* ---------------- instellingenvenster ---------------- */
function renderInst(){
  const secties = instellingenSecties(), smal = window.innerWidth <= 900;
  const s = secties.find(x => x.id === instSectie) || secties[0];
  const oud = $("#instHouder .instscroll"), scroll = oud ? oud.scrollTop : 0, zelfde = oud && oud.dataset.sectie === s.id;
  $("#instHouder").innerHTML = `<div class="instsluier" id="instSluier"><div class="instvenster" role="dialog" aria-modal="true" aria-label="Instellingen">
    <nav class="instzij"><div class="instzijkop">Instellingen</div>${secties.map(x => `<button type="button" class="instnav${x.id === s.id ? " aan" : ""}" data-sectie="${x.id}"><span class="sq" style="background:${x.kleur}">${ico(x.icoon)}</span>${esc(x.titel)}</button>`).join("")}</nav>
    <div class="instinhoud">
      <div class="instkop"><h2>${smal ? "Instellingen" : esc(s.titel)}</h2>${!smal && s.knop ? s.knop : ""}<button type="button" class="rond" data-sluit aria-label="Sluiten">${ico("kruis")}</button></div>
      <div class="instscroll" data-sectie="${s.id}">${smal ? secties.map(sectieHtml).join("") : s.html + (s.voet ? `<div class="voetnoot">${s.voet}</div>` : "") + (s.na || "")}</div>
    </div></div></div>`;
  if(zelfde) $("#instHouder .instscroll").scrollTop = scroll;
  bindInstellingen($("#instHouder"), renderInst);
  $("#instHouder .instzij").onclick = e => { const b = e.target.closest("[data-sectie]"); if(!b) return; instSectie = b.dataset.sectie; renderInst(); };
  $("#instHouder [data-sluit]").onclick = sluitInst;
  $("#instSluier").addEventListener("pointerdown", e => { if(e.target.id === "instSluier") sluitInst(); });
}
function openInst(){ instOpen = true; sluitDetail(); renderInst(); $("#instHouder [data-sluit]").focus(); }
function sluitInst(){ instOpen = false; $("#instHouder").innerHTML = ""; }

/* ---------------- overige knoppen ---------------- */
function zetPaneel(p){
  $("#app").dataset.paneel = p;
  $$("#mWissel button").forEach(b => b.classList.toggle("aan", b.dataset.p === p));
  if(p === "agenda"){ laatsteWeekSleutel = ""; ververs(); }
}
function toonNummerFout(){
  zetPaneel("dossier");
  const f = $("#fNummer"); f.classList.add("fout"); $("#fNummerFout").classList.remove("verborgen");
  f.scrollIntoView({block:"center", behavior:"smooth"}); f.focus({preventScroll:true});
}
$("#mWissel").onclick = e => { const b = e.target.closest("[data-p]"); if(b) zetPaneel(b.dataset.p); };
$("#kAgenda").onclick = zetInAgenda;
$("#kNieuw").onclick = () => { if(!bevestigNieuw()) return; sluitDetail(); nieuwDossier(); volg = true; renderZij(); ververs(); zetPaneel("dossier"); $("#fNummer").focus(); };
$("#kInst").onclick = openInst;
$("#kVorige").onclick = () => { volg = false; if(weergave === "dag") dagInBeeld = plusDagen(dagInBeeld, -1); else weekStart = plusDagen(weekStart, -7); ververs(); };
$("#kVolgende").onclick = () => { volg = false; if(weergave === "dag") dagInBeeld = plusDagen(dagInBeeld, 1); else weekStart = plusDagen(weekStart, 7); ververs(); };
$("#kVandaag").onclick = () => { volg = false; if(weergave === "dag") dagInBeeld = dagStart(new Date()); else weekStart = maandagVan(new Date()); ververs(); };
$("#kWeergave").onclick = e => {
  const b = e.target.closest("[data-n]"); if(!b || b.dataset.n === weergave) return;
  const nieuw = b.dataset.n;
  if(nieuw === "dag"){
    // naar de eerste dag met afspraken in de week die in beeld was
    const inWeek = plan(dos).filter(p => p.start >= weekStart && p.start < plusDagen(weekStart, 7));
    dagInBeeld = inWeek.length ? dagStart(eersteVan(inWeek)) : (dagInBeeld && maandagVan(dagInBeeld).getTime() === weekStart.getTime() ? dagInBeeld : weekStart);
  } else if(weergave === "dag") weekStart = maandagVan(dagInBeeld);
  weergave = nieuw;
  $$("#kWeergave button").forEach(x => x.classList.toggle("aan", x === b));
  laatsteWeekSleutel = ""; ververs();
};
$("#kMeer").onclick = () => menuOpen ? sluitMenu() : openMenu();
document.addEventListener("pointerdown", e => {
  if(pop && !e.target.closest(".pop") && !e.target.closest(".ev") && !e.target.closest("[data-info]")) sluitDetail();
  if(menuOpen && !e.target.closest(".menu") && !e.target.closest("#kMeer")) sluitMenu();
});
/* Sneltoetsen zoals in Agenda: pijltjes voor vorige en volgende, T voor vandaag, D en W voor dag en week */
document.addEventListener("keydown", e => {
  if(e.key === "Escape" || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.target.closest && e.target.closest("input, select, textarea") || pop || instOpen || menuOpen) return;
  const k = e.key.toLowerCase(), kies = n => $(`#kWeergave [data-n="${n}"]`).click();
  if(e.key === "ArrowLeft"){ e.preventDefault(); $("#kVorige").click(); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); $("#kVolgende").click(); }
  else if(k === "t") $("#kVandaag").click();
  else if(k === "d") kies("dag");
  else if(k === "w") kies(weergave === "5" ? "7" : "5");
});
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if(menuOpen){ sluitMenu(); $("#kMeer").focus(); }
  else if(pop) sluitDetail();
  else if(instOpen) sluitInst();
});
setInterval(() => { if(!pop && !instOpen && !$(".ev.sleept") && document.visibilityState === "visible") renderKalender(plan(dos)); }, 60000);

/* ---------------- icoon: een kalenderblad met de datum van vandaag ---------------- */
function kalenderIcoon(d, losBestand){
  const f = "-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Arial,sans-serif";
  return `<svg ${losBestand ? 'xmlns="http://www.w3.org/2000/svg" ' : ""}viewBox="0 0 100 100" aria-hidden="true">
    <rect width="100" height="100" rx="23" fill="#fff"/>
    <path d="M0 23A23 23 0 0 1 23 0h54a23 23 0 0 1 23 23v9H0z" fill="#FF3B30"/>
    <text x="50" y="23.5" text-anchor="middle" font-family="${f}" font-size="19" font-weight="700" fill="#fff">${esc(wdKort(d))}</text>
    <text x="50" y="83" text-anchor="middle" font-family="${f}" font-size="54" font-weight="600" letter-spacing="-2" fill="#1C1C1E">${d.getDate()}</text>
    <rect x=".5" y=".5" width="99" height="99" rx="22.5" fill="none" stroke="rgba(0,0,0,.1)"/>
  </svg>`;
}
let icoonDag = "";
function zetIcoon(){
  const d = new Date(), iso = datumIso(d);
  if(iso === icoonDag) return;
  icoonDag = iso;
  $("#appIcoon").innerHTML = kalenderIcoon(d);
  let l = document.querySelector('link[rel="icon"]');
  if(!l){ l = document.createElement("link"); l.rel = "icon"; document.head.appendChild(l); }
  l.type = "image/svg+xml";
  l.href = "data:image/svg+xml," + encodeURIComponent(kalenderIcoon(d, true));
}
setInterval(zetIcoon, 60000);

zetIcoon();
pasThemaToe();
nieuwDossier();
renderZij();
ververs();

})();
</script>
